[workspace]
members = [
    "inception",
    "inception-derive-gen",
    "inception-macros",
    "inception-test",
]
resolver = "2"

[workspace.dependencies]
quote = "1"
paste = "1"
proc-macro-crate = "3"
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
inception = { path = "./inception" }
inception-derive-gen = { path = "./inception-derive-gen", version = "0.1.0" }
inception-macros = { path = "./inception-macros", version = "0.1.0" }
